<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>カーリング最終投 シミュレーター</title>
<style>
  html, body { margin: 0; padding: 0; background: #0f2b3d; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<!-- React + ReactDOM (UMD builds, no npm install needed) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

<!-- Babel standalone: lets the browser understand JSX directly -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
